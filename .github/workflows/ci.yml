name: CI

on:
  pull_request:
  push:
    branches: 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # The published contract (static/{pack,scenario}.schema.json, llms.txt) is
      # generated from the TypeScript types. Regenerate and fail on any diff, so
      # a type change that was not reflected in the schemas cannot ship.
      - name: Schemas are up to date with the types
        run: |
          bun run schemas
          git diff --exit-code --stat static/ \
            || { echo "::error::static/ is stale — run 'bun run schemas' and commit the result"; exit 1; }

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
