name: CI

on:
  pull_request:
  push:
    branches: 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # full history: the version-bump check diffs the schemas against the base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # The published contract (static/{pack,scenario}.schema.json, llms.txt) is
      # generated from the TypeScript types. Fails if regeneration produces
      # different content than what is committed, or if a schema's content
      # changed without x-tableplace-spec-version being bumped.
      - name: Published contract is current and versioned
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          if [ -n "$BASE" ]; then
            bun run schemas:check --base "$BASE"
          else
            bun run schemas:check
          fi

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
